<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ring Road &mdash; drive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%232a323d' stroke-width='6'/%3E%3Ccircle cx='16' cy='5' r='2.6' fill='%233ddc84'/%3E%3Ccircle cx='25.5' cy='21' r='2.6' fill='%23ffd93d'/%3E%3Ccircle cx='6.5' cy='21' r='2.6' fill='%23ff4d4d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="drive.css">
</head>
<body>

<div id="join" class="overlay">
  <div class="card">
    <h1>RING ROAD</h1>
    <p class="sub">One lane. No passing. Lift off and you roll to a stop.</p>
    <input id="name" maxlength="16" placeholder="your name" autocomplete="off">
    <input id="pin" maxlength="12" placeholder="PIN" autocomplete="off" hidden>
    <button id="go">DRIVE</button>
    <p id="joinerr" class="joinerr" hidden></p>
    <p class="hint"><kbd>&uarr;</kbd><kbd>W</kbd> gas &nbsp;&middot;&nbsp; <kbd>&darr;</kbd><kbd>S</kbd><kbd>space</kbd> brake</p>
  </div>
</div>

<div class="wrap">
  <canvas id="view"></canvas>
  <div id="flash"></div>

  <div class="hud-top">
    <div class="gauge">
      <b id="speed">0</b><span>mph</span>
    </div>
    <div class="right">
      <button id="sound" class="chip" title="engine sound">&#9834;</button>
      <div class="chip" id="crashchip"><b id="crashes">0</b> crashes</div>
    </div>
  </div>

  <div class="hud-gap">
    <div class="gaprow">
      <b id="gap">--</b><span>ft to <i id="aheadwho">&mdash;</i></span>
    </div>
    <div class="gaptrack"><div id="gapbar"></div></div>
  </div>

  <div id="warn"></div>

  <div class="pedals">
    <button id="brake" class="pedal stop">BRAKE</button>
    <button id="accel" class="pedal go">GAS</button>
  </div>
</div>

<script src="units.js"></script>
<script src="cars.js"></script>
<script src="cockpit.js"></script>
<script src="fx.js"></script>
<script src="net.js"></script>
<script src="drive.js"></script>
</body>
</html>
